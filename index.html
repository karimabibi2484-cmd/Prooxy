
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>High Quality Barcode Scanner</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ZXing fallback -->
    <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4ff;
        }

        .camera-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            min-height: 300px;
        }

        video {
            width: 100%;
            height: 100%;
            min-height: 300px;

            object-fit: cover;

            display: block;

            background: #000;
        }

        /*
            Barcode scanning area
        */

        .scan-frame {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 420px;

            height: 150px;

            border: 3px solid #22c55e;

            border-radius: 12px;

            box-shadow:
                0 0 0 9999px
                rgba(0, 0, 0, 0.38);

            pointer-events: none;

            overflow: hidden;
        }

        .scan-line {

            position: absolute;

            left: 0;

            width: 100%;

            height: 3px;

            background: #22c55e;

            box-shadow:
                0 0 8px #22c55e;

            animation:
                scanLine 1.6s linear infinite;
        }

        @keyframes scanLine {

            0% {
                top: 0%;
            }

            50% {
                top: 100%;
            }

            100% {
                top: 0%;
            }

        }

        .corner {

            position: absolute;

            width: 24px;
            height: 24px;

            border-color: #ffffff;

        }

        .top-left {

            top: -2px;
            left: -2px;

            border-top: 4px solid;
            border-left: 4px solid;

        }

        .top-right {

            top: -2px;
            right: -2px;

            border-top: 4px solid;
            border-right: 4px solid;

        }

        .bottom-left {

            bottom: -2px;
            left: -2px;

            border-bottom: 4px solid;
            border-left: 4px solid;

        }

        .bottom-right {

            bottom: -2px;
            right: -2px;

            border-bottom: 4px solid;
            border-right: 4px solid;

        }

        .success {

            animation:
                successAnimation 0.4s ease;
        }

        @keyframes successAnimation {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }

        }

    </style>

</head>


<body>


<div class="min-h-screen flex items-center justify-center p-4">

    <div
        class="w-full max-w-lg bg-white
               rounded-2xl shadow-xl overflow-hidden"
    >

        <!-- HEADER -->

        <div
            class="bg-blue-600
                   px-6 py-6 text-center"
        >

            <h1
                class="text-2xl font-bold text-white"
            >
                High Quality Barcode Scanner
            </h1>

            <p
                class="text-blue-100 mt-1 text-sm"
            >
                Use your rear camera for best results
            </p>

        </div>


        <div class="p-5">


            <!-- CAMERA -->

            <div class="camera-container">

                <video
                    id="video"
                    autoplay
                    muted
                    playsinline
                ></video>


                <!-- SCAN FRAME -->

                <div
                    id="scanFrame"
                    class="scan-frame hidden"
                >

                    <div class="scan-line"></div>

                    <div
                        class="corner top-left"
                    ></div>

                    <div
                        class="corner top-right"
                    ></div>

                    <div
                        class="corner bottom-left"
                    ></div>

                    <div
                        class="corner bottom-right"
                    ></div>

                </div>


                <!-- CAMERA MESSAGE -->

                <div
                    id="cameraMessage"
                    class="absolute inset-0
                           flex items-center
                           justify-center
                           text-white
                           text-center
                           px-6"
                >

                    Tap Start Scanner

                </div>

            </div>


            <!-- CAMERA INFORMATION -->

            <div
                id="cameraInfo"
                class="hidden mt-3
                       bg-gray-50
                       rounded-lg p-3
                       text-xs text-gray-600"
            >

                <div>
                    Resolution:
                    <b id="resolution">
                        -
                    </b>
                </div>

                <div class="mt-1">
                    Camera:
                    <b id="cameraName">
                        Rear camera
                    </b>
                </div>

                <div class="mt-1">
                    Focus:
                    <b id="focusInfo">
                        -
                    </b>
                </div>

            </div>


            <!-- STATUS -->

            <div
                class="flex justify-center mt-4"
            >

                <div
                    class="flex items-center"
                >

                    <span
                        id="statusDot"
                        class="w-3 h-3
                               rounded-full
                               bg-gray-400
                               mr-2"
                    ></span>

                    <span
                        id="statusText"
                        class="text-sm
                               text-gray-600"
                    >
                        Camera off
                    </span>

                </div>

            </div>


            <!-- START -->

            <button
                id="startButton"
                type="button"
                class="w-full mt-5
                       bg-blue-600
                       hover:bg-blue-700
                       text-white
                       font-semibold
                       py-3 rounded-xl"
            >

                📷 Start Scanner

            </button>


            <!-- STOP -->

            <button
                id="stopButton"
                type="button"
                class="hidden w-full mt-3
                       bg-gray-200
                       hover:bg-gray-300
                       text-gray-700
                       font-semibold
                       py-3 rounded-xl"
            >

                Stop Camera

            </button>


            <!-- RESULT -->

            <div
                id="resultContainer"
                class="hidden mt-5"
            >

                <div
                    class="bg-green-50
                           border border-green-200
                           rounded-xl p-4"
                >

                    <div
                        class="flex items-center"
                    >

                        <div
                            class="w-10 h-10
                                   bg-green-500
                                   rounded-full
                                   flex items-center
                                   justify-center
                                   text-white text-xl"
                        >
                            ✓
                        </div>

                        <div class="ml-3">

                            <p
                                class="font-semibold
                                       text-green-800"
                            >
                                Barcode Scanned
                            </p>

                            <p
                                class="text-xs
                                       text-green-600"
                            >
                                Data stored successfully
                            </p>

                        </div>

                    </div>


                    <div
                        id="result"
                        class="mt-3
                               bg-white
                               rounded-lg
                               p-3
                               font-mono
                               text-sm
                               break-all"
                    ></div>

                </div>

            </div>


            <!-- COUNT -->

            <div
                class="mt-5
                       bg-gray-50
                       rounded-xl
                       p-4 text-center"
            >

                <p
                    class="text-xs
                           text-gray-500"
                >
                    Stored Scans
                </p>

                <p
                    id="scanCount"
                    class="text-2xl
                           font-bold
                           text-blue-600"
                >
                    0
                </p>

            </div>


            <!-- CLEAR -->

            <button
                id="clearButton"
                class="w-full mt-3
                       text-sm text-red-500"
            >

                Clear Stored Data

            </button>


        </div>


        <div
            class="bg-gray-50
                   border-t p-4"
        >

            <p
                class="text-center
                       text-xs
                       text-gray-500"
            >

                Keep the barcode inside the green frame

            </p>

        </div>

    </div>

</div>



<script>


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const startButton =
    document.getElementById("startButton");

const stopButton =
    document.getElementById("stopButton");

const scanFrame =
    document.getElementById("scanFrame");

const cameraMessage =
    document.getElementById("cameraMessage");

const cameraInfo =
    document.getElementById("cameraInfo");

const resolution =
    document.getElementById("resolution");

const cameraName =
    document.getElementById("cameraName");

const focusInfo =
    document.getElementById("focusInfo");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const resultContainer =
    document.getElementById("resultContainer");

const result =
    document.getElementById("result");

const scanCount =
    document.getElementById("scanCount");

const clearButton =
    document.getElementById("clearButton");


/* =========================================================
   VARIABLES
========================================================= */

let stream = null;

let scanning = false;

let scanTimer = null;

let barcodeDetector = null;

let zxingReader = null;

let lastScannedCode = null;

let useNativeDetector = false;


/* =========================================================
   BARCODE FORMATS
========================================================= */

const barcodeFormats = [

    "aztec",

    "code_128",

    "code_39",

    "code_93",

    "codabar",

    "data_matrix",

    "ean_13",

    "ean_8",

    "itf",

    "pdf417",

    "qr_code",

    "upc_a",

    "upc_e"

];


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    message,
    type = "normal"
) {

    statusText.textContent =
        message;


    if (type === "scanning") {

        statusDot.className =
            "w-3 h-3 bg-green-500 rounded-full mr-2";

    }

    else if (type === "success") {

        statusDot.className =
            "w-3 h-3 bg-green-500 rounded-full mr-2";

    }

    else if (type === "error") {

        statusDot.className =
            "w-3 h-3 bg-red-500 rounded-full mr-2";

    }

    else if (type === "warning") {

        statusDot.className =
            "w-3 h-3 bg-yellow-500 rounded-full mr-2";

    }

    else {

        statusDot.className =
            "w-3 h-3 bg-gray-400 rounded-full mr-2";

    }

}


/* =========================================================
   STORAGE
========================================================= */

function getStoredData() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "barcodeData"
            ) || "[]"
        );

    } catch {

        return [];

    }

}


function saveBarcodeData(data) {

    const stored =
        getStoredData();


    stored.push({

        barcodeData: data,

        timestamp:
            new Date().toISOString()

    });


    localStorage.setItem(
        "barcodeData",
        JSON.stringify(stored)
    );


    updateCount();

}


function updateCount() {

    scanCount.textContent =
        getStoredData().length;

}


/* =========================================================
   CAMERA CAPABILITIES
========================================================= */

async function optimizeCamera() {

    if (!stream) {
        return;
    }


    const track =
        stream.getVideoTracks()[0];


    if (!track) {
        return;
    }


    const capabilities =
        track.getCapabilities();


    const settings =
        track.getSettings();


    /*
       Display actual resolution
    */

    resolution.textContent =
        `${settings.width || "-"} × ${settings.height || "-"}`;


    /*
       Continuous autofocus
    */

    if (
        capabilities.focusMode &&
        capabilities.focusMode.includes(
            "continuous"
        )
    ) {

        try {

            await track.applyConstraints({

                advanced: [

                    {
                        focusMode:
                            "continuous"
                    }

                ]

            });

            focusInfo.textContent =
                "Continuous autofocus";

        } catch {

            focusInfo.textContent =
                "Automatic";

        }

    }

    else {

        focusInfo.textContent =
            "Automatic";

    }


    /*
       Try to enable maximum useful zoom
       only when supported.

       We deliberately do NOT force
       maximum zoom because excessive
       digital zoom can make a barcode
       harder to decode.
    */

    if (
        capabilities.zoom &&
        capabilities.zoom.min !== undefined
    ) {

        try {

            /*
               Use a modest zoom.

               The exact value depends
               on the phone.
            */

            const minZoom =
                capabilities.zoom.min;

            const maxZoom =
                capabilities.zoom.max;

            const targetZoom =
                Math.min(
                    maxZoom,
                    Math.max(
                        minZoom,
                        1.5
                    )
                );


            await track.applyConstraints({

                advanced: [

                    {
                        zoom:
                            targetZoom
                    }

                ]

            });

        } catch {

            // Zoom not supported.

        }

    }

}


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        setStatus(
            "Camera not supported",
            "error"
        );

        return;

    }


    if (!window.isSecureContext) {

        setStatus(
            "HTTPS is required",
            "error"
        );

        cameraMessage.textContent =
            "Open this website using HTTPS.";

        return;

    }


    try {

        setStatus(
            "Requesting camera...",
            "warning"
        );


        /*
           HIGH QUALITY CAMERA REQUEST

           We request 4K first.

           If the device/browser cannot provide
           it, the browser will negotiate a
           suitable resolution.
        */

        const constraints = {

            audio: false,

            video: {

                facingMode: {
                    ideal: "environment"
                },

                width: {
                    min: 1280,
                    ideal: 1920,
                    max: 3840
                },

                height: {
                    min: 720,
                    ideal: 1080,
                    max: 2160
                },

                frameRate: {
                    ideal: 30,
                    max: 60
                }

            }

        };


        stream =
            await navigator.mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            stream;


        /*
           Wait for camera metadata.
        */

        await new Promise(
            resolve => {

                if (
                    video.readyState >= 2
                ) {

                    resolve();

                }

                else {

                    video.onloadedmetadata =
                        resolve;

                }

            }
        );


        await video.play();


        /*
           Optimize actual camera.
        */

        await optimizeCamera();


        /*
           Display actual settings.
        */

        const track =
            stream.getVideoTracks()[0];

        const settings =
            track.getSettings();


        resolution.textContent =
            `${settings.width} × ${settings.height}`;


        cameraName.textContent =
            track.label ||
            "Rear camera";


        /*
           Camera UI
        */

        cameraMessage.classList.add(
            "hidden"
        );

        scanFrame.classList.remove(
            "hidden"
        );

        cameraInfo.classList.remove(
            "hidden"
        );

        startButton.classList.add(
            "hidden"
        );

        stopButton.classList.remove(
            "hidden"
        );


        setStatus(
            "Scanning...",
            "scanning"
        );


        /*
           Setup decoder.
        */

        setupDecoder();


        scanning = true;


        scanFrameLoop();

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        handleCameraError(
            error
        );

    }

}


/* =========================================================
   DECODER SETUP
========================================================= */

function setupDecoder() {

    /*
       Prefer native BarcodeDetector
       when available.
    */

    if (
        "BarcodeDetector" in window
    ) {

        try {

            barcodeDetector =
                new BarcodeDetector({

                    formats:
                        barcodeFormats

                });


            useNativeDetector =
                true;


            console.log(
                "Using native BarcodeDetector"
            );


            return;

        }

        catch {

            useNativeDetector =
                false;

        }

    }


    /*
       Fallback to ZXing.
    */

    useNativeDetector =
        false;

    zxingReader =
        new ZXing.BrowserMultiFormatReader();


    console.log(
        "Using ZXing fallback"
    );

}


/* =========================================================
   NATIVE BARCODE DETECTION
========================================================= */

async function detectNative() {

    if (!barcodeDetector) {
        return null;
    }


    try {

        const detected =
            await barcodeDetector.detect(
                video
            );


        if (
            detected &&
            detected.length > 0
        ) {

            return detected[0].rawValue;

        }

    }

    catch {

        // Nothing detected.

    }


    return null;

}


/* =========================================================
   ZXING DETECTION
========================================================= */

async function detectZXing() {

    if (!zxingReader) {
        return null;
    }


    try {

        /*
           Decode directly from video.

           ZXing handles the image processing.
        */

        const scanResult =
            await zxingReader
                .decodeFromVideoElement(
                    video
                );


        if (scanResult) {

            return scanResult.getText();

        }

    }

    catch {

        // No barcode found.

    }


    return null;

}


/* =========================================================
   SCANNING LOOP
========================================================= */

async function scanFrameLoop() {

    if (!scanning) {
        return;
    }


    let barcode = null;


    /*
       First try native detector.
    */

    if (useNativeDetector) {

        barcode =
            await detectNative();

    }


    /*
       If native detection didn't
       find anything, use ZXing.

       This makes detection more
       tolerant across devices.
    */

    if (!barcode && !useNativeDetector) {

        barcode =
            await detectZXing();

    }


    /*
       BARCODE FOUND
    */

    if (barcode) {

        handleBarcode(
            barcode
        );

        return;

    }


    /*
       Scan again.

       100 ms ≈ 10 attempts/sec.
    */

    if (scanning) {

        scanTimer =
            setTimeout(
                scanFrameLoop,
                100
            );

    }

}


/* =========================================================
   BARCODE FOUND
========================================================= */

function handleBarcode(data) {

    if (!data) {
        return;
    }


    /*
       Prevent immediate duplicate.
    */

    if (
        data === lastScannedCode
    ) {

        return;

    }


    lastScannedCode =
        data;


    /*
       STORE
    */

    saveBarcodeData(
        data
    );


    /*
       SHOW
    */

    result.textContent =
        data;


    resultContainer.classList.remove(
        "hidden"
    );


    resultContainer.classList.add(
        "success"
    );


    setStatus(
        "Barcode scanned successfully",
        "success"
    );


    /*
       STOP CAMERA
    */

    stopCamera();


    /*
       Allow same barcode again
       after one second.
    */

    setTimeout(
        () => {

            lastScannedCode =
                null;

        },
        1000
    );

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

    scanning = false;


    if (scanTimer) {

        clearTimeout(
            scanTimer
        );

        scanTimer = null;

    }


    /*
       Stop ZXing reader if possible.
    */

    if (zxingReader) {

        try {

            zxingReader.reset();

        }

        catch {}

    }


    /*
       Stop camera.
    */

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream = null;

    }


    video.srcObject = null;


    scanFrame.classList.add(
        "hidden"
    );

    cameraInfo.classList.add(
        "hidden"
    );

    stopButton.classList.add(
        "hidden"
    );

    startButton.classList.remove(
        "hidden"
    );

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startCamera
);


/* =========================================================
   STOP
========================================================= */

stopButton.addEventListener(
    "click",
    () => {

        stopCamera();


        cameraMessage.textContent =
            "Tap Start Scanner";


        cameraMessage.classList.remove(
            "hidden"
        );


        setStatus(
            "Camera stopped"
        );

    }
);


/* =========================================================
   CLEAR STORAGE
========================================================= */

clearButton.addEventListener(
    "click",
    () => {

        if (
            !confirm(
                "Delete all stored barcode data?"
            )
        ) {

            return;

        }


        localStorage.removeItem(
            "barcodeData"
        );


        updateCount();


        result.textContent =
            "";

        resultContainer.classList.add(
            "hidden"
        );

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

updateCount();


</script>

</body>

</html>
