<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Barcode Scanner</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ZXing Barcode Scanner -->
    <script src="https://unpkg.com/@zxing/library@0.21.3"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        video {
            transform: scaleX(1);
        }

        .scan-box {
            position: absolute;
            width: 80%;
            max-width: 320px;
            height: 130px;
            border: 3px solid #22c55e;
            border-radius: 12px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #22c55e;
            top: 50%;
            animation: scanLine 1.5s linear infinite;
        }

        @keyframes scanLine {
            0% {
                transform: translateY(-60px);
            }

            50% {
                transform: translateY(60px);
            }

            100% {
                transform: translateY(-60px);
            }
        }

        .success {
            animation: successFlash 0.4s ease;
        }

        @keyframes successFlash {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">

    <div class="min-h-screen flex items-center justify-center p-4">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">

            <!-- HEADER -->
            <div class="bg-blue-600 p-6 text-center">
                <h1 class="text-2xl font-bold text-white">
                    Quick Barcode Scanner
                </h1>

                <p class="text-blue-100 text-sm mt-1">
                    Scan your ID to mark attendance
                </p>
            </div>


            <!-- MAIN -->
            <div class="p-5">

                <!-- CAMERA -->
                <div class="relative bg-black rounded-xl overflow-hidden aspect-video">

                    <video
                        id="video"
                        autoplay
                        muted
                        playsinline
                        class="w-full h-full object-cover">
                    </video>

                    <!-- SCANNING AREA -->
                    <div id="scanBox" class="scan-box hidden">
                        <div class="scan-line"></div>
                    </div>

                    <!-- CAMERA MESSAGE -->
                    <div
                        id="cameraMessage"
                        class="absolute inset-0 flex items-center justify-center text-white text-sm">
                        Starting camera...
                    </div>

                </div>


                <!-- STATUS -->
                <div class="flex justify-center mt-4">

                    <div
                        id="status"
                        class="flex items-center text-gray-600">

                        <span
                            id="statusDot"
                            class="w-3 h-3 bg-gray-400 rounded-full mr-2">
                        </span>

                        <span id="statusText">
                            Preparing scanner...
                        </span>

                    </div>

                </div>


                <!-- START BUTTON -->
                <button
                    id="startButton"
                    class="w-full mt-5 bg-blue-600 hover:bg-blue-700
                           text-white font-semibold py-3 rounded-xl
                           transition">

                    Start Scanner

                </button>


                <!-- RESULT -->
                <div
                    id="resultContainer"
                    class="hidden mt-5">

                    <div
                        class="bg-green-50 border border-green-200
                               rounded-xl p-4">

                        <div class="flex items-center mb-2">

                            <div
                                class="w-8 h-8 bg-green-500 rounded-full
                                       flex items-center justify-center
                                       text-white mr-3">

                                ✓

                            </div>

                            <div>

                                <p class="font-semibold text-green-800">
                                    Barcode Scanned
                                </p>

                                <p class="text-xs text-green-600">
                                    Attendance data stored
                                </p>

                            </div>

                        </div>


                        <div
                            id="result"
                            class="bg-white rounded-lg p-3
                                   mt-3 text-sm font-mono
                                   break-all text-gray-800">
                        </div>

                    </div>

                </div>


                <!-- STORED COUNT -->
                <div
                    class="mt-5 bg-gray-50 rounded-xl p-4 text-center">

                    <p class="text-xs text-gray-500">
                        Stored Scans
                    </p>

                    <p
                        id="scanCount"
                        class="text-2xl font-bold text-blue-600">
                        0
                    </p>

                </div>


                <!-- CLEAR STORAGE -->
                <button
                    id="clearStorage"
                    class="w-full mt-3 text-sm text-red-500
                           hover:text-red-700">

                    Clear Stored Data

                </button>

            </div>


            <!-- FOOTER -->
            <div class="bg-gray-50 border-t p-4">

                <p class="text-center text-xs text-gray-500">
                    Place your barcode inside the green box
                </p>

            </div>

        </div>

    </div>


    <script>

        /* =========================================================
           ELEMENTS
        ========================================================= */

        const video = document.getElementById("video");

        const startButton =
            document.getElementById("startButton");

        const scanBox =
            document.getElementById("scanBox");

        const cameraMessage =
            document.getElementById("cameraMessage");

        const statusText =
            document.getElementById("statusText");

        const statusDot =
            document.getElementById("statusDot");

        const resultContainer =
            document.getElementById("resultContainer");

        const result =
            document.getElementById("result");

        const scanCount =
            document.getElementById("scanCount");

        const clearStorage =
            document.getElementById("clearStorage");


        /* =========================================================
           VARIABLES
        ========================================================= */

        let stream = null;

        let scanning = false;

        let scanTimer = null;

        let codeReader = null;

        let lastScannedCode = null;


        /* =========================================================
           STORAGE
        ========================================================= */

        function getStoredData() {

            try {

                return JSON.parse(
                    localStorage.getItem("barcodeData") || "[]"
                );

            } catch (error) {

                return [];

            }

        }


        function saveBarcodeData(data) {

            const existingData = getStoredData();

            existingData.push({

                barcodeData: data,

                timestamp: new Date().toISOString()

            });

            localStorage.setItem(
                "barcodeData",
                JSON.stringify(existingData)
            );

            updateCount();
        }


        function updateCount() {

            const data = getStoredData();

            scanCount.textContent = data.length;

        }


        /* =========================================================
           STATUS
        ========================================================= */

        function setStatus(message, type = "normal") {

            statusText.textContent = message;


            if (type === "scanning") {

                statusDot.className =
                    "w-3 h-3 bg-green-500 rounded-full mr-2";

            }

            else if (type === "success") {

                statusDot.className =
                    "w-3 h-3 bg-green-500 rounded-full mr-2";

            }

            else if (type === "error") {

                statusDot.className =
                    "w-3 h-3 bg-red-500 rounded-full mr-2";

            }

            else {

                statusDot.className =
                    "w-3 h-3 bg-gray-400 rounded-full mr-2";

            }

        }


        /* =========================================================
           CAMERA
        ========================================================= */

        async function startCamera() {

            try {

                setStatus("Starting camera...");

                stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            facingMode: {
                                ideal: "environment"
                            },

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            },

                            frameRate: {
                                ideal: 30,
                                max: 30
                            }

                        },

                        audio: false

                    });


                video.srcObject = stream;

                await video.play();


                cameraMessage.classList.add("hidden");

                scanBox.classList.remove("hidden");


                setStatus(
                    "Scanner ready",
                    "scanning"
                );


                startButton.textContent =
                    "Scanning...";


                startButton.disabled = true;

                startScanning();


            } catch (error) {

                console.error(error);

                cameraMessage.textContent =
                    "Camera access denied";

                setStatus(
                    "Camera permission required",
                    "error"
                );

                startButton.disabled = false;

            }

        }


        /* =========================================================
           STOP CAMERA
        ========================================================= */

        function stopCamera() {

            scanning = false;


            if (scanTimer) {

                clearTimeout(scanTimer);

                scanTimer = null;

            }


            if (stream) {

                stream.getTracks().forEach(
                    track => track.stop()
                );

                stream = null;

            }


            video.srcObject = null;

            scanBox.classList.add("hidden");

            startButton.disabled = false;

            startButton.textContent =
                "Start Scanner";

        }


        /* =========================================================
           SCANNER
        ========================================================= */

        function startScanning() {

            if (!stream) return;

            scanning = true;

            scanFrame();

        }


        async function scanFrame() {

            if (!scanning) return;


            try {

                /*
                    ZXing analyzes the camera frame.

                    It supports many formats including:

                    QR_CODE
                    CODE_128
                    CODE_39
                    CODE_93
                    EAN_13
                    EAN_8
                    UPC_A
                    UPC_E
                    ITF
                */


                if (!codeReader) {

                    codeReader =
                        new ZXing.BrowserMultiFormatReader();

                }


                const result =
                    await codeReader.decodeFromVideoElement(
                        video
                    );


                if (result) {

                    handleBarcode(
                        result.getText()
                    );

                    return;

                }

            } catch (error) {

                /*
                    No barcode found.

                    This is normal.
                    Do not show an error.
                */

            }


            /*
                Wait approximately 100 ms
                before checking again.

                ≈ 10 scans per second.
            */

            if (scanning) {

                scanTimer = setTimeout(
                    scanFrame,
                    100
                );

            }

        }


        /* =========================================================
           BARCODE FOUND
        ========================================================= */

        function handleBarcode(data) {

            if (!data) return;


            /*
                Prevent the same barcode from
                being processed twice immediately.
            */

            if (data === lastScannedCode) {

                return;

            }


            lastScannedCode = data;


            /* SAVE */
            saveBarcodeData(data);


            /* SHOW RESULT */
            result.textContent = data;

            resultContainer.classList.remove(
                "hidden"
            );

            resultContainer.classList.add(
                "success"
            );


            setStatus(
                "Scan successful",
                "success"
            );


            /*
                STOP CAMERA IMMEDIATELY
            */

            stopCamera();


            /*
                Automatically allow another scan
                after a short delay.
            */

            setTimeout(() => {

                lastScannedCode = null;

            }, 1000);

        }


        /* =========================================================
           START BUTTON
        ========================================================= */

        startButton.addEventListener(
            "click",
            () => {

                if (!stream) {

                    startCamera();

                }

            }
        );


        /* =========================================================
           CLEAR STORAGE
        ========================================================= */

        clearStorage.addEventListener(
            "click",
            () => {

                const confirmClear =
                    confirm(
                        "Delete all stored barcode data?"
                    );


                if (!confirmClear) return;


                localStorage.removeItem(
                    "barcodeData"
                );


                updateCount();


                resultContainer.classList.add(
                    "hidden"
                );


                result.textContent = "";


                setStatus(
                    "Stored data cleared"
                );

            }
        );


        /* =========================================================
           INITIALIZATION
        ========================================================= */

        updateCount();

    </script>

</body>
</html>
